name: Build and Deploy Front-End MVC (Staging Environment)

on:
  push:
    branches:
      - staging  # Otomatis jalan saat PR di-merge ke branch staging

jobs:
  build-and-deploy-mvc-staging:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Staging Code
        uses: actions/checkout@v4

      # 2. Login ke Docker Hub pake PAT
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Setup Docker Buildx (Cross-platform AMD64 VPS)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build dan Push Docker Image MVC
      - name: Build and Push MVC Docker Image (Staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          # Ganti path Dockerfile jika file Dockerfile MVC berada di sub-folder
          file: ./Dockerfile   # Atau ./ProcurementWeb/Dockerfile
          platforms: linux/amd64
          push: true
          tags: myramadhani/procurement-app:v1

      # 5. Remote SSH ke VPS & Restart Deployment Front-End K3s
      - name: Deploy MVC to K3s Staging via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 103.169.207.165
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Ganti 'procurement-web-app-deployment' sesuai nama deployment MVC di manifest kamu
            kubectl rollout restart deployment procurement-app-deployment