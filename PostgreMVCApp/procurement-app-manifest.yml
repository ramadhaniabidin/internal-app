apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: procurement-app
  template:
    metadata:
      labels:
        app: procurement-app
    spec:
      containers:
        - name: procurement-app
          image: myramadhani/procurement-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ApiBaseUrl
              value: "https://api.procurement-app.my.id/api"
            - name: ConnectionStrings__PostgresConnection
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__DockerPostgresConnection
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: procurement-app-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: procurement-app